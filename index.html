<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Garage Sale Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#1f2937}
header{background:#2563eb;color:#fff;padding:18px 20px}
header h1{margin:0 0 4px}
.wrap{width:min(1050px,calc(100% - 24px));margin:18px auto 40px;display:grid;gap:18px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
#map{height:420px;border-radius:12px;margin-top:12px}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box;margin-top:6px}
textarea{min-height:90px}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.danger{background:#fee2e2;color:#991b1b}.secondary{background:#e5e7eb;color:#1f2937}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.search-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.search-row button{min-width:110px}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.filter-btn{background:#e5e7eb;color:#1f2937}.filter-btn.active{background:#2563eb;color:#fff}.distance-select{min-height:41px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px;background:white;color:#1f2937;font-weight:700}.favorite-btn.active{background:#fef3c7;color:#92400e}.distance-label{font-size:14px;font-weight:700;color:#475569}
.sale{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:#64748b;font-size:14px}
.error{color:#991b1b}.sale-photo{width:100%;max-width:420px;max-height:300px;object-fit:cover;border-radius:10px;margin:8px 0 12px;display:block;cursor:pointer}.results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.result-count{font-weight:700;color:#475569}.badge-row{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 8px}.sale-badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.badge-new{background:#dcfce7;color:#166534}.badge-ending{background:#fee2e2;color:#991b1b}.refresh-status{align-self:center}.compact-btn.active{background:#2563eb;color:#fff}#list.compact-view .sale{padding:10px;margin-top:8px}#list.compact-view .sale h3{margin:2px 0 6px}#list.compact-view .sale p{margin:4px 0}#list.compact-view .sale-photo{max-width:220px;max-height:145px;margin:6px 0 8px}#list.compact-view .actions{gap:6px;margin-top:7px}#list.compact-view .actions button{padding:8px 10px;font-size:14px}.photo-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.photo-modal.open{display:flex}.photo-modal-inner{position:relative;max-width:min(900px,95vw);max-height:90vh}.photo-modal img{display:block;max-width:100%;max-height:85vh;border-radius:12px;background:#fff}.photo-modal-close{position:absolute;right:-10px;top:-12px;width:44px;height:44px;border-radius:50%;background:#fff;color:#111827;font-size:26px;line-height:1;padding:0;box-shadow:0 3px 12px rgba(0,0,0,.35)}.photo-section{margin-top:16px;padding:16px;border:2px solid #2563eb;border-radius:12px;background:#eff6ff}.photo-title{font-size:20px;font-weight:800;color:#1d4ed8;margin-bottom:6px;display:block}.photo-note{display:block;font-size:14px;color:#475569;margin:6px 0 0}.empty-state{padding:22px;border:2px solid #cbd5e1;border-radius:12px;background:#f8fafc;text-align:center;font-size:22px;font-weight:700;color:#334155;margin-top:12px}.empty-state small{display:block;font-size:14px;font-weight:400;color:#64748b;margin-top:6px}
@media(max-width:700px){.grid{grid-template-columns:1fr}#map{height:340px}}
</style>
</head>
<body>
<header><h1>Garage Sale Finder</h1><div>Find nearby garage sales or post your own.</div></header>

<div class="wrap">
  <section class="card">
    <div class="search-row">
      <input id="search" placeholder="Search by address, item, or ZIP code...">
      <button id="searchBtn" class="primary" type="button">Search</button>
    </div>
    <div class="filter-row" aria-label="Date filters">
      <button class="filter-btn active" type="button" data-filter="all">All Sales</button>
      <button class="filter-btn" type="button" data-filter="today">Today</button>
      <button class="filter-btn" type="button" data-filter="tomorrow">Tomorrow</button>
      <button class="filter-btn" type="button" data-filter="weekend">This Weekend</button>
      <button id="savedOnlyBtn" class="filter-btn" type="button">★ Saved Sales</button>
    </div>
    <div class="filter-row" aria-label="Distance filter">
      <button id="useLocationBtn" class="secondary" type="button">📍 Use My Location</button>
      <span class="distance-label">Show within</span>
      <select id="distanceFilter" class="distance-select" disabled>
        <option value="all">Any Distance</option>
        <option value="5">5 miles</option>
        <option value="10">10 miles</option>
        <option value="25">25 miles</option>
        <option value="50">50 miles</option>
      </select>
      <span id="locationStatus" class="muted">Location not set.</span>
      <button id="photosOnlyBtn" class="filter-btn" type="button">📷 Photos Only</button>
      <span class="distance-label">Sort</span>
      <select id="sortChoice" class="distance-select">
        <option value="newest">Newest First</option>
        <option value="nearest">Nearest First</option>
        <option value="ending">Ending Soonest</option>
      </select>
      <button id="clearFiltersBtn" class="secondary" type="button">Clear Filters</button>
    </div>
    <div id="map"></div>
  </section>

  <section class="card">
    <div class="results-head">
      <h2>Garage Sales</h2>
      <span id="resultCount" class="result-count">0 sales</span>
    </div>
    <div class="actions">
      <button id="refreshBtn" class="secondary" type="button">↻ Refresh Listings</button>
      <button id="compactViewBtn" class="secondary compact-btn" type="button">Compact View</button>
      <button id="restoreHidden" class="secondary" type="button" style="display:none">Show Hidden Sales Again</button>
      <span id="refreshStatus" class="muted refresh-status"></span>
    </div>
    <div id="list"><p class="muted">Loading garage sales...</p></div>
  </section>

  <section class="card">
    <h2>Post a Garage Sale</h2>
    <p class="muted">Sales automatically disappear after their ending time.</p>
    <form id="form">
      <div class="grid">
        <label>Address
          <input id="address" required placeholder="123 Main St, City, State ZIP">
        </label>
        <label>Sale Date
          <input id="date" type="date" required>
        </label>
      </div>
      <div class="grid">
        <label>Ends
          <input id="ends" type="datetime-local" required>
        </label>
        <label>Items
          <input id="items" required placeholder="Furniture, tools, clothes, toys...">
        </label>
      </div>
      <div class="photo-section">
        <label for="photo" class="photo-title">📷 Add a Photo (Optional)</label>
        <input id="photo" type="file" accept="image/*">
        <span class="photo-note">A photo helps shoppers see what you have. Maximum photo size: 10 MB.</span>
      </div>
      <button class="primary" type="submit">Post Garage Sale</button>
    </form>
    <p id="status" class="muted"></p>
  </section>
</div>

<div id="photoModal" class="photo-modal" role="dialog" aria-modal="true" aria-label="Garage sale photo" onclick="if(event.target===this)closePhoto()">
  <div class="photo-modal-inner">
    <button class="photo-modal-close" type="button" aria-label="Close photo" onclick="closePhoto()">×</button>
    <img id="modalPhoto" src="" alt="Garage sale photo">
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://wfdvaqzdqthwnarbmwns.supabase.co';
const SUPABASE_KEY='sb_publishable_DaHk2sr-fSYJBCBt8vOesw_HDRrbPBF';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let sales=[];
let dateFilter='all';
let savedOnly=false;
let photosOnly=false;
let compactView=false;
let userLocation=null;
const HIDDEN_KEY='garage_sale_hidden_ids_v1';
const FAVORITES_KEY='garage_sale_favorite_ids_v1';
let hiddenIds=[];
let favoriteIds=[];
try{
  hiddenIds=JSON.parse(localStorage.getItem(HIDDEN_KEY)||'[]');
  if(!Array.isArray(hiddenIds)) hiddenIds=[];
}catch(e){
  hiddenIds=[];
}

try{
  favoriteIds=JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]');
  if(!Array.isArray(favoriteIds)) favoriteIds=[];
}catch(e){
  favoriteIds=[];
}

function saveHiddenIds(){
  localStorage.setItem(HIDDEN_KEY,JSON.stringify(hiddenIds));
}

function isHidden(id){
  return hiddenIds.map(String).includes(String(id));
}

function saveFavoriteIds(){
  localStorage.setItem(FAVORITES_KEY,JSON.stringify(favoriteIds));
}

function isFavorite(id){
  return favoriteIds.map(String).includes(String(id));
}

function toggleFavorite(id){
  const key=String(id);
  if(isFavorite(id)){
    favoriteIds=favoriteIds.filter(x=>String(x)!==key);
  }else{
    favoriteIds.push(key);
  }
  saveFavoriteIds();
  render();
}

const map=L.map('map').setView([39.2461,-94.4191],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

let markers=[];

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function directions(a){
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a);
}

function milesBetween(lat1,lon1,lat2,lon2){
  const toRad=x=>x*Math.PI/180;
  const R=3958.8;
  const dLat=toRad(lat2-lat1);
  const dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function saleDistance(s){
  if(!userLocation||!Number.isFinite(s.lat)||!Number.isFinite(s.lon)) return null;
  return milesBetween(userLocation.lat,userLocation.lon,s.lat,s.lon);
}

async function shareSale(id){
  const s=sales.find(x=>String(x.id)===String(id));
  if(!s) return;

  const text=[
    'Garage Sale',
    s.address,
    'Date: '+formatSaleDate(s.date),
    s.ends_at ? 'Ends: '+formatEnd(s.ends_at) : '',
    'Items: '+s.items,
    'Directions: '+directions(s.address)
  ].filter(Boolean).join('\n');

  try{
    if(navigator.share){
      await navigator.share({title:'Garage Sale',text});
    }else if(navigator.clipboard){
      await navigator.clipboard.writeText(text);
      alert('Garage sale details copied. You can paste them into a text or email.');
    }else{
      prompt('Copy these garage sale details:',text);
    }
  }catch(err){
    if(err?.name!=='AbortError') console.error(err);
  }
}

function openPhoto(id){
  const s=sales.find(x=>String(x.id)===String(id));
  if(!s||!s.photo_url) return;
  const modal=document.getElementById('photoModal');
  const img=document.getElementById('modalPhoto');
  img.src=s.photo_url;
  img.alt='Garage sale photo at '+s.address;
  modal.classList.add('open');
  document.body.style.overflow='hidden';
}

function closePhoto(){
  const modal=document.getElementById('photoModal');
  const img=document.getElementById('modalPhoto');
  modal.classList.remove('open');
  img.src='';
  document.body.style.overflow='';
}

async function copyAddress(id){
  const s=sales.find(x=>String(x.id)===String(id));
  if(!s) return;

  try{
    if(navigator.clipboard){
      await navigator.clipboard.writeText(s.address);
      alert('Address copied.');
    }else{
      prompt('Copy this address:',s.address);
    }
  }catch(err){
    console.error(err);
    prompt('Copy this address:',s.address);
  }
}

function requestLocation(){
  const status=document.getElementById('locationStatus');
  const select=document.getElementById('distanceFilter');
  if(!navigator.geolocation){
    status.textContent='Location is not available in this browser.';
    return;
  }

  status.textContent='Finding your location...';
  navigator.geolocation.getCurrentPosition(
    pos=>{
      userLocation={lat:pos.coords.latitude,lon:pos.coords.longitude};
      select.disabled=false;
      status.textContent='Location ready.';
      render();
    },
    ()=>{
      status.textContent='Location permission was not granted.';
    },
    {enableHighAccuracy:false,timeout:10000,maximumAge:300000}
  );
}

function formatEnd(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return '';
  return d.toLocaleString();
}


function localDayStart(d){
  return new Date(d.getFullYear(),d.getMonth(),d.getDate());
}

function parseSaleDate(value,endsAt){
  const raw=String(value||'').trim();

  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){
    const [y,m,d]=raw.split('-').map(Number);
    return new Date(y,m-1,d);
  }

  if(raw){
    const parsed=new Date(raw);
    if(!Number.isNaN(parsed.getTime())) return localDayStart(parsed);
  }

  if(endsAt){
    const end=new Date(endsAt);
    if(!Number.isNaN(end.getTime())) return localDayStart(end);
  }

  return null;
}

function formatSaleDate(value){
  const d=parseSaleDate(value,null);
  if(!d) return value || '';
  return d.toLocaleDateString([],{
    weekday:'short',
    month:'short',
    day:'numeric',
    year:'numeric'
  });
}

function sameDay(a,b){
  return a&&b&&
    a.getFullYear()===b.getFullYear()&&
    a.getMonth()===b.getMonth()&&
    a.getDate()===b.getDate();
}

function weekendRange(now){
  const today=localDayStart(now);
  const day=today.getDay();
  let daysToSaturday=(6-day+7)%7;
  if(day===0) daysToSaturday=-1;

  const saturday=new Date(today);
  saturday.setDate(today.getDate()+daysToSaturday);
  const sunday=new Date(saturday);
  sunday.setDate(saturday.getDate()+1);
  return {saturday,sunday};
}

function matchesDateFilter(s){
  if(dateFilter==='all') return true;

  const saleDate=parseSaleDate(s.date,s.ends_at);
  if(!saleDate) return false;

  const today=localDayStart(new Date());

  if(dateFilter==='today') return sameDay(saleDate,today);

  if(dateFilter==='tomorrow'){
    const tomorrow=new Date(today);
    tomorrow.setDate(today.getDate()+1);
    return sameDay(saleDate,tomorrow);
  }

  if(dateFilter==='weekend'){
    const {saturday,sunday}=weekendRange(today);
    return sameDay(saleDate,saturday)||sameDay(saleDate,sunday);
  }

  return true;
}

function isActive(row){
  const now=Date.now();

  if(row.ends_at){
    const end=new Date(row.ends_at).getTime();
    return Number.isFinite(end) && end > now;
  }

  if(row.created_at){
    const created=new Date(row.created_at).getTime();
    return Number.isFinite(created) && created + (48*60*60*1000) > now;
  }

  return false;
}

function normalizeSale(row){
  return {
    id: row.id,
    address: row.address || '',
    date: row.date || '',
    items: row.items || '',
    lat: row.latitude == null ? null : Number(row.latitude),
    lon: row.longitude == null ? null : Number(row.longitude),
    created_at: row.created_at || null,
    ends_at: row.ends_at || null,
    photo_url: row.photo_url || ''
  };
}

function badgeMarkup(s){
  const badges=[];
  const now=Date.now();

  if(s.created_at){
    const created=new Date(s.created_at).getTime();
    if(Number.isFinite(created) && now-created <= 24*60*60*1000){
      badges.push('<span class="sale-badge badge-new">NEW</span>');
    }
  }

  if(s.ends_at){
    const end=new Date(s.ends_at).getTime();
    const remaining=end-now;
    if(Number.isFinite(end) && remaining>0 && remaining <= 2*60*60*1000){
      badges.push('<span class="sale-badge badge-ending">ENDING SOON</span>');
    }
  }

  return badges.length ? '<div class="badge-row">'+badges.join('')+'</div>' : '';
}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  let filtered=sales
    .filter(isActive)
    .filter(s=>!isHidden(s.id))
    .filter(matchesDateFilter)
    .filter(s=>!savedOnly||isFavorite(s.id))
    .filter(s=>!photosOnly||Boolean(s.photo_url))
    .filter(s=>{
      const selected=document.getElementById('distanceFilter').value;
      if(selected==='all'||!userLocation) return true;
      const d=saleDistance(s);
      return d!==null&&d<=Number(selected);
    })
    .filter(s=>[s.address,s.date,s.items].join(' ').toLowerCase().includes(q));

  const sortChoice=document.getElementById('sortChoice').value;
  if(sortChoice==='nearest'&&userLocation){
    filtered.sort((a,b)=>{
      const da=saleDistance(a);
      const db=saleDistance(b);
      if(da===null&&db===null) return 0;
      if(da===null) return 1;
      if(db===null) return -1;
      return da-db;
    });
  }else if(sortChoice==='ending'){
    filtered.sort((a,b)=>new Date(a.ends_at||'9999-12-31').getTime()-new Date(b.ends_at||'9999-12-31').getTime());
  }else{
    filtered.sort((a,b)=>new Date(b.created_at||0).getTime()-new Date(a.created_at||0).getTime());
  }

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  const list=document.getElementById('list');
  list.classList.toggle('compact-view',compactView);
  const resultCount=document.getElementById('resultCount');
  resultCount.textContent=filtered.length+' '+(filtered.length===1?'sale':'sales');
  const restoreButton=document.getElementById('restoreHidden');
  restoreButton.style.display=hiddenIds.length ? 'inline-block' : 'none';

  if(!filtered.length){
    list.innerHTML='<div class="empty-state">No Garage Sales Found<small>Try changing the search, date, saved, photo, distance, or sort filter.</small></div>';
    return;
  }

  list.innerHTML=filtered.map(s=>`
    <div class="sale">
      <h3>${esc(s.address)}</h3>
      ${badgeMarkup(s)}
      <p><b>Date:</b> ${esc(formatSaleDate(s.date))}</p>
      ${s.ends_at ? `<p><b>Ends:</b> ${esc(formatEnd(s.ends_at))}</p>` : ''}
      <p><b>Items:</b> ${esc(s.items)}</p>
      ${saleDistance(s)!==null ? `<p><b>Distance:</b> ${saleDistance(s).toFixed(1)} miles away</p>` : ''}
      ${s.photo_url ? `<img class="sale-photo" src="${esc(s.photo_url)}" alt="Garage sale photo" loading="lazy" onclick="openPhoto(${s.id})" title="Tap to enlarge">` : ''}
      <div class="actions">
        ${s.photo_url ? `<button class="secondary" onclick="openPhoto(${s.id})">View Larger Photo</button>` : ''}
        <button class="primary" onclick="window.open('${directions(s.address)}','_blank')">Get Directions</button>
        <button class="secondary favorite-btn ${isFavorite(s.id)?'active':''}" onclick="toggleFavorite(${s.id})">${isFavorite(s.id)?'★ Saved':'☆ Save Sale'}</button>
        <button class="secondary" onclick="shareSale(${s.id})">Share Sale</button>
        <button class="secondary" onclick="copyAddress(${s.id})">Copy Address</button>
        <button class="secondary" onclick="hideSale(${s.id})">Hide From My List</button>
      </div>
    </div>
  `).join('');

  const bounds=[];
  filtered.forEach(s=>{
    if(Number.isFinite(s.lat)&&Number.isFinite(s.lon)){
      const endLine=s.ends_at ? `<br><b>Ends:</b> ${esc(formatEnd(s.ends_at))}` : '';
      const m=L.marker([s.lat,s.lon]).addTo(map)
        .bindPopup(`<b>${esc(s.address)}</b><br>${esc(formatSaleDate(s.date))}${endLine}<br>${esc(s.items)}`);
      markers.push(m);
      bounds.push([s.lat,s.lon]);
    }
  });

  if(bounds.length===1) map.setView(bounds[0],13);
  if(bounds.length>1) map.fitBounds(bounds,{padding:[25,25]});
}

async function loadSales(showRefreshMessage=false){
  const list=document.getElementById('list');
  const refreshButton=document.getElementById('refreshBtn');
  const refreshStatus=document.getElementById('refreshStatus');

  if(showRefreshMessage){
    refreshButton.disabled=true;
    refreshStatus.textContent='Refreshing...';
  }

  const {data,error}=await db
    .from('garage_sales')
    .select('id,address,date,items,latitude,longitude,created_at,ends_at,photo_url')
    .order('created_at',{ascending:false});

  if(showRefreshMessage) refreshButton.disabled=false;

  if(error){
    console.error(error);
    if(showRefreshMessage) refreshStatus.textContent='Could not refresh.';
    list.innerHTML='<p class="muted error">Could not load garage sales. Please refresh and try again.</p>';
    return;
  }

  sales=(data||[]).map(normalizeSale);
  render();

  if(showRefreshMessage){
    refreshStatus.textContent='Updated just now.';
    setTimeout(()=>{
      if(refreshStatus.textContent==='Updated just now.') refreshStatus.textContent='';
    },4000);
  }
}

async function geocode(address){
  const r=await fetch(
    'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+
    encodeURIComponent(address)
  );
  if(!r.ok) throw Error('Geocoding request failed');
  const j=await r.json();
  if(!j.length) throw Error('Address not found');
  return {lat:Number(j[0].lat),lon:Number(j[0].lon)};
}

async function uploadPhoto(file){
  if(!file) return '';

  if(!file.type || !file.type.startsWith('image/')){
    throw Error('Please choose an image file.');
  }

  if(file.size > 10 * 1024 * 1024){
    throw Error('Photo must be 10 MB or smaller.');
  }

  const ext=(file.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase() || 'jpg';
  const path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

  const {error}=await db.storage
    .from('garage-sale-photos')
    .upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});

  if(error) throw error;

  const {data}=db.storage.from('garage-sale-photos').getPublicUrl(path);
  return data.publicUrl || '';
}

async function addSale(e){
  e.preventDefault();

  const address=document.getElementById('address').value.trim();
  const date=document.getElementById('date').value.trim();
  const items=document.getElementById('items').value.trim();
  const endsRaw=document.getElementById('ends').value;
  const photoFile=document.getElementById('photo').files[0] || null;
  const status=document.getElementById('status');
  const button=e.target.querySelector('button[type="submit"]');

  const endsDate=new Date(endsRaw);
  if(Number.isNaN(endsDate.getTime()) || endsDate.getTime() <= Date.now()){
    status.classList.add('error');
    status.textContent='Please choose an ending time in the future.';
    return;
  }

  status.classList.remove('error');
  status.textContent='Finding address on map...';
  button.disabled=true;

  let loc={lat:null,lon:null};
  try{
    loc=await geocode(address);
  }catch(err){
    console.warn(err);
  }

  let photoUrl='';
  if(photoFile){
    status.textContent='Uploading photo...';
    try{
      photoUrl=await uploadPhoto(photoFile);
    }catch(err){
      console.error(err);
      button.disabled=false;
      status.classList.add('error');
      status.textContent=err?.message || 'Could not upload the photo. Please try again.';
      return;
    }
  }

  status.textContent='Saving garage sale...';

  const {data,error}=await db
    .from('garage_sales')
    .insert({
      address,
      date,
      items,
      latitude:loc.lat,
      longitude:loc.lon,
      ends_at:endsDate.toISOString(),
      photo_url:photoUrl
    })
    .select('id,address,date,items,latitude,longitude,created_at,ends_at,photo_url')
    .single();

  button.disabled=false;

  if(error){
    console.error(error);
    status.classList.add('error');
    status.textContent='Could not post the garage sale. Please try again.';
    return;
  }

  sales.unshift(normalizeSale(data));
  e.target.reset();
  render();

  status.textContent=Number.isFinite(loc.lat)&&Number.isFinite(loc.lon)
    ? 'Garage sale posted. It will automatically disappear after the ending time.'
    : 'Garage sale posted. It will expire automatically, but the address could not be placed on the map.';
}

function hideSale(id){
  const sale=sales.find(s=>String(s.id)===String(id));
  const label=sale?.address ? `\n\n${sale.address}` : '';
  const ok=confirm('Hide this garage sale from your list? This only hides it for you and does not remove it for anyone else.'+label);
  if(!ok) return;

  if(!isHidden(id)){
    hiddenIds.push(String(id));
    saveHiddenIds();
  }
  render();
}

function restoreHiddenSales(){
  hiddenIds=[];
  saveHiddenIds();
  render();
}


document.getElementById('form').addEventListener('submit',addSale);
document.getElementById('search').addEventListener('input',render);
document.getElementById('searchBtn').addEventListener('click',render);
document.getElementById('search').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    render();
  }
});
document.getElementById('restoreHidden').addEventListener('click',restoreHiddenSales);
document.getElementById('refreshBtn').addEventListener('click',()=>loadSales(true));
document.getElementById('compactViewBtn').addEventListener('click',()=>{
  compactView=!compactView;
  const button=document.getElementById('compactViewBtn');
  button.classList.toggle('active',compactView);
  button.textContent=compactView?'Regular View':'Compact View';
  render();
});
document.getElementById('useLocationBtn').addEventListener('click',requestLocation);
document.getElementById('distanceFilter').addEventListener('change',render);
document.getElementById('sortChoice').addEventListener('change',render);
document.getElementById('clearFiltersBtn').addEventListener('click',()=>{
  document.getElementById('search').value='';
  dateFilter='all';
  savedOnly=false;
  photosOnly=false;
  document.getElementById('distanceFilter').value='all';
  document.getElementById('sortChoice').value='newest';
  document.getElementById('savedOnlyBtn').classList.remove('active');
  document.getElementById('photosOnlyBtn').classList.remove('active');
  document.querySelectorAll('.filter-btn[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closePhoto();
});
document.getElementById('photosOnlyBtn').addEventListener('click',()=>{
  photosOnly=!photosOnly;
  document.getElementById('photosOnlyBtn').classList.toggle('active',photosOnly);
  render();
});
document.getElementById('savedOnlyBtn').addEventListener('click',()=>{
  savedOnly=!savedOnly;
  document.getElementById('savedOnlyBtn').classList.toggle('active',savedOnly);
  render();
});
document.querySelectorAll('.filter-btn[data-filter]').forEach(button=>{
  button.addEventListener('click',()=>{
    dateFilter=button.dataset.filter||'all';
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b=>b.classList.toggle('active',b===button));
    render();
  });
});
setInterval(render,60000);
loadSales();
</script>
</body>
</html>
