<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Garage Sale Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#1f2937}
header{background:#2563eb;color:#fff;padding:18px 20px}
header h1{margin:0 0 4px}
.wrap{width:min(1050px,calc(100% - 24px));margin:18px auto 40px;display:grid;gap:18px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
#map{height:420px;border-radius:12px;margin-top:12px}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box;margin-top:6px}
textarea{min-height:90px}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sale{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:#64748b;font-size:14px}
.error{color:#991b1b}
@media(max-width:700px){.grid{grid-template-columns:1fr}#map{height:340px}}
</style>
</head>
<body>
<header><h1>Garage Sale Map</h1><div>Find nearby garage sales or post your own.</div></header>

<div class="wrap">
  <section class="card">
    <input id="search" placeholder="Search by address, item, or ZIP code...">
    <div id="map"></div>
  </section>

  <section class="card">
    <h2>Garage Sales</h2>
    <div id="list"><p class="muted">Loading garage sales...</p></div>
  </section>

  <section class="card">
    <h2>Post a Garage Sale</h2>
    <p class="muted">Sales are shared online so other visitors can find them.</p>
    <form id="form">
      <div class="grid">
        <label>Address
          <input id="address" required placeholder="123 Main St, City, State ZIP">
        </label>
        <label>Date
          <input id="date" required placeholder="Saturday, Sept. 20">
        </label>
      </div>
      <label>Items
        <textarea id="items" required placeholder="Furniture, tools, clothes, toys..."></textarea>
      </label>
      <button class="primary" type="submit">Post Garage Sale</button>
    </form>
    <p id="status" class="muted"></p>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://wfdvaqzdqthwnarbmwns.supabase.co';
const SUPABASE_KEY='sb_publishable_DaHk2sr-fSYJBCBt8vOesw_HDRrbPBF';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let sales=[];
const map=L.map('map').setView([39.2461,-94.4191],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

let markers=[];

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function directions(a){
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a);
}

function normalizeSale(row){
  return {
    id: row.id,
    address: row.address || '',
    date: row.date || '',
    items: row.items || '',
    lat: row.latitude == null ? null : Number(row.latitude),
    lon: row.longitude == null ? null : Number(row.longitude)
  };
}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const filtered=sales.filter(s=>
    [s.address,s.date,s.items].join(' ').toLowerCase().includes(q)
  );

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  const list=document.getElementById('list');

  if(!filtered.length){
    list.innerHTML='<p class="muted">No garage sales found.</p>';
    return;
  }

  list.innerHTML=filtered.map(s=>`
    <div class="sale">
      <h3>${esc(s.address)}</h3>
      <p><b>Date:</b> ${esc(s.date)}</p>
      <p><b>Items:</b> ${esc(s.items)}</p>
      <div class="actions">
        <button class="primary" onclick="window.open('${directions(s.address)}','_blank')">Get Directions</button>
      </div>
    </div>
  `).join('');

  const bounds=[];
  filtered.forEach(s=>{
    if(Number.isFinite(s.lat)&&Number.isFinite(s.lon)){
      const m=L.marker([s.lat,s.lon]).addTo(map)
        .bindPopup(`<b>${esc(s.address)}</b><br>${esc(s.date)}<br>${esc(s.items)}`);
      markers.push(m);
      bounds.push([s.lat,s.lon]);
    }
  });

  if(bounds.length===1) map.setView(bounds[0],13);
  if(bounds.length>1) map.fitBounds(bounds,{padding:[25,25]});
}

async function loadSales(){
  const list=document.getElementById('list');
  const {data,error}=await db
    .from('garage_sales')
    .select('id,address,date,items,latitude,longitude,created_at')
    .order('created_at',{ascending:false});

  if(error){
    console.error(error);
    list.innerHTML='<p class="muted error">Could not load garage sales. Please refresh and try again.</p>';
    return;
  }

  sales=(data||[]).map(normalizeSale);
  render();
}

async function geocode(address){
  const r=await fetch(
    'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+
    encodeURIComponent(address)
  );
  if(!r.ok) throw Error('Geocoding request failed');
  const j=await r.json();
  if(!j.length) throw Error('Address not found');
  return {lat:Number(j[0].lat),lon:Number(j[0].lon)};
}

async function addSale(e){
  e.preventDefault();

  const address=document.getElementById('address').value.trim();
  const date=document.getElementById('date').value.trim();
  const items=document.getElementById('items').value.trim();
  const status=document.getElementById('status');
  const button=e.target.querySelector('button[type="submit"]');

  status.classList.remove('error');
  status.textContent='Finding address on map...';
  button.disabled=true;

  let loc={lat:null,lon:null};
  try{
    loc=await geocode(address);
  }catch(err){
    console.warn(err);
  }

  status.textContent='Saving garage sale...';

  const {data,error}=await db
    .from('garage_sales')
    .insert({
      address,
      date,
      items,
      latitude:loc.lat,
      longitude:loc.lon
    })
    .select('id,address,date,items,latitude,longitude,created_at')
    .single();

  button.disabled=false;

  if(error){
    console.error(error);
    status.classList.add('error');
    status.textContent='Could not post the garage sale. Please try again.';
    return;
  }

  sales.unshift(normalizeSale(data));
  e.target.reset();
  render();

  status.textContent=Number.isFinite(loc.lat)&&Number.isFinite(loc.lon)
    ? 'Garage sale posted and added to the map.'
    : 'Garage sale posted. The address could not be placed on the map, but Get Directions will still work.';
}

document.getElementById('form').addEventListener('submit',addSale);
document.getElementById('search').addEventListener('input',render);
loadSales();
</script>
</body>
</html>
